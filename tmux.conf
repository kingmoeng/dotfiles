# ~/.tmux.conf — tmux 설정
# tmux 3.0 이상을 가정한다. 서버 버전은 tmux -V 로 확인.

# ------------------------------------------------------------------ prefix
# Ctrl+b 는 셸/vim 의 한 글자 뒤로 이동과 겹쳐서 Ctrl+Space 로 옮긴다.
# macOS 에서는 시스템 설정 > 키보드 > 단축키 > 입력 소스에서
# Ctrl+Space(입력 소스 전환)를 먼저 꺼야 한다. 리눅스도 IBus 를 쓰면 마찬가지.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix            # 두 번 누르면 안쪽(원격 tmux 등)에 전달

# ------------------------------------------------------------------ 분할 / 창 / 세션
# -c 로 현재 판의 작업 디렉터리를 물려준다. 기본 키(% " c)도 같이 맞춰 둔다.
bind | split-window -h -c "#{pane_current_path}"    # 좌/우 분할
bind - split-window -v -c "#{pane_current_path}"    # 상/하 분할
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind J choose-tree -Z "join-pane -h -s '%%'"        # 목록에서 골라 현재 화면에 합치기
bind S command-prompt -p "새 세션 이름:" "new-session -c '#{pane_current_path}' -s '%%'"
bind X confirm-before -p "세션 '#S' 종료? (y/n)" kill-session

bind r source-file ~/.tmux.conf \; display-message "tmux.conf 다시 불러옴"

# ------------------------------------------------------------------ 기본 동작
set -g mouse on                     # 클릭으로 판 선택, 테두리 드래그로 크기 조절, 휠 스크롤
                                    # 터미널 자체의 텍스트 선택은 Shift+드래그
set -sg escape-time 10              # Esc 반응 지연 제거 (기본 500ms)
set -g history-limit 50000          # 스크롤백 (기본 2000줄)
set -g focus-events on

# 복사 내용을 OSC52 로 시스템 클립보드에 보낸다. SSH 너머에서도 동작하지만
# 터미널이 OSC52 를 지원해야 한다. GNOME Terminal 은 지원하지 않고,
# iTerm2 는 Settings > General > Selection 에서 따로 켜야 한다.
set -g set-clipboard on

setw -g mode-keys vi                # 복사 모드에서 hjkl 이동, v 선택, y 복사

set -g base-index 1                 # 창 번호 1부터 (키보드 숫자열 순서)
setw -g pane-base-index 1
set -g renumber-windows on          # 창 닫으면 번호 당겨서 재정렬

set -g detach-on-destroy off        # 세션 종료 시 tmux 에서 튕기지 않고 다른 세션으로 이동

# ------------------------------------------------------------------ 화면 표시
# tmux-256color terminfo 가 없는 오래된 서버가 있다. 그대로 두면 색이 깨지거나
# "missing or unsuitable terminal" 경고가 뜨므로, 없으면 screen-256color 로 떨어진다.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc"          # 트루컬러
                                    # 3.2+ 의 terminal-features 대신 이 방식을 쓰는 건
                                    # 2.x~3.1 서버에서도 그대로 동작하기 때문이다.

set -g status-left-length 30        # 세션 이름 잘림 방지 (기본 10자)
set -g status-left "[#S] "
setw -g pane-border-status top      # 판 테두리에 번호·실행 중인 명령 표시
setw -g pane-border-format " #{pane_index}: #{pane_current_command} "

# ------------------------------------------------------------------ 머신 전용
# 이 저장소에 넣으면 안 되는 것들(회사 설정, 특정 머신 경로)은 여기에.
# -q 는 파일이 없을 때 조용히 넘어간다.
source-file -q ~/.tmux.conf.local
